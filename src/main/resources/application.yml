wizard:
  api:
    base-url: "https://wizard-world-api.herokuapp.com"
    ingredients-path: "/Ingredients"
    elixirs-path: "/Elixirs"
    connect-timeout: "5s"
    request-timeout: "15s"
    max-retries: 2
    backoff-millis: 250
  synonyms:
    map:
      leech juice: leech juice
      boomslang-skin: boomslang skin
      neemuoil: neem oil

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: "never"
